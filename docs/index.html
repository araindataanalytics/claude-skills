
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Impact Wolves | Claude Skills</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f6f8fb;
      color: #172033;
    }
    header {
      background: #111827;
      color: white;
      padding: 50px max(24px, calc((100% - 1000px)/2));
    }
    header p { color: #cbd5e1; }
    main { max-width: 1000px; margin: 35px auto; padding: 0 24px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
    }
    .card p { color: #64748b; min-height: 55px; }
    .download {
      display: inline-block;
      padding: 10px 14px;
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Impact Wolves Skills Library</h1>
    <p>Reusable skills for Claude and AI workflows.</p>
  </header>

  <main>
    <input id="search" placeholder="Search skills...">
    <div class="grid" id="catalog"></div>
  </main>

  <script>
    const skills = [
      {
        name: "Amazon PPC Analysis",
        description: "Analyze campaign and ASIN performance.",
        file: "amazon-ppc-analysis.zip"
      },
      {
        name: "Data Validation",
        description: "Validate datasets and detect errors.",
        file: "data-validation.zip"
      },
      {
        name: "n8n Automation",
        description: "Develop and troubleshoot n8n workflows.",
        file: "n8n-automation.zip"
      }
    ];

    const catalog = document.getElementById("catalog");
    const search = document.getElementById("search");

    function render(query = "") {
      catalog.innerHTML = "";
      skills
        .filter(s => (s.name + " " + s.description)
          .toLowerCase().includes(query.toLowerCase()))
        .forEach(s => {
          const card = document.createElement("article");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = s.name;

          const desc = document.createElement("p");
          desc.textContent = s.description;

          const link = document.createElement("a");
          link.className = "download";
          link.href = "downloads/" + s.file;
          link.textContent = "Download ZIP";
          link.setAttribute("download", "");

          card.append(title, desc, link);
          catalog.appendChild(card);
        });
    }

    search.addEventListener("input", () => render(search.value));
    render();
  </script>
</body>
</html>
